<!-- REFERENCE ONLY - not loaded at runtime.
     js/projects.js renderProjectCard() builds this markup itself; nothing fetches this file.
     Kept as a readable reference for the intended structure. Edit the
     JS renderer to change what users actually see. -->
<a href="project-details.html?id={{id}}" class="project-card">
  <div class="project-name">{{name}}</div>
  <div class="project-meta">{{contractor}} • {{location}}</div>

  <div class="project-progress">
    <span>Progress</span>
    <span>{{progress}}%</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" style="width: {{progress}}%"></div>
  </div>

  <div class="flex justify-between mt-md">
    <span class="text-sm text-muted">{{status}}</span>
    <span class="text-sm"><strong>{{budget}}</strong></span>
  </div>
</a>
