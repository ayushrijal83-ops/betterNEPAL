<!-- REFERENCE ONLY - not loaded at runtime.
     js/reports.js builds this markup itself; nothing fetches this file.
     Kept as a readable reference for the intended structure. Edit the
     JS renderer to change what users actually see. -->
<tr>
  <td>#{{id}}</td>
  <td>{{title}}</td>
  <td>{{category}}</td>
  <td>{{severity}}</td>
  <td><span class="badge {{badgeClass}}">{{status}}</span></td>
  <td>{{date}}</td>
  <td class="actions">
    <a href="report-details.html?id={{id}}" class="btn btn-sm btn-outline">View</a>
  </td>
</tr>
