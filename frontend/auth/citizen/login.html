<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Citizen Login — Better Nepal</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/forms.css" />
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--bn-navy) 0%, var(--bn-blue) 100%);
      padding: var(--space-lg);
    }
    .auth-card {
      background: var(--bn-white);
      border-radius: var(--radius-lg);
      padding: var(--space-2xl);
      width: 100%; max-width: 420px;
      box-shadow: var(--shadow-lg);
    }
    .auth-brand { display:flex; align-items:center; gap: var(--space-sm); margin-bottom: var(--space-lg); }
    .auth-brand-logo {
      width:44px;height:44px;background:var(--bn-red);color:var(--bn-white);
      border-radius: var(--radius-md); display:flex;align-items:center;justify-content:center;
      font-weight:700;font-size:18px;
    }
    .auth-title { font-size: var(--font-size-xl); font-weight:700; color: var(--bn-navy); }
    .auth-sub   { color: var(--bn-text-light); font-size: var(--font-size-sm); margin-bottom: var(--space-lg); }
    .auth-footer { margin-top: var(--space-lg); text-align: center; font-size: var(--font-size-sm); color: var(--bn-text-light); }
    .auth-back { display:inline-block; margin-top: var(--space-md); font-size: var(--font-size-xs); color: var(--bn-text-muted); }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-brand-logo">NP</div>
        <div>
          <div class="auth-title">Better Nepal</div>
          <div class="auth-sub">Citizen Portal</div>
        </div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" type="email" id="email" value="citizen@betternepal.gov.np" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" id="password" value="demo1234" required />
        </div>
        <button class="btn btn-primary btn-lg" style="width:100%" type="submit">Sign in</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register</a>
      </div>
      <a href="../../index.html" class="auth-back">← Back to home</a>
    </div>
  </div>

  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
  document.getElementById("login-form").addEventListener("submit", (e) => {
    e.preventDefault();
    setRole("citizen");
    sessionStorage.setItem("bn_flash", "Signed in successfully");
    window.location.href = "../../pages/citizen/dashboard.html";
  });
</script>
</body>
</html>
