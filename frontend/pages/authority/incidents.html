<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem("bn_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Incidents — Better Nepal</title>

  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/nepal.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>

    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>

      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title" data-i18n="nav.incidents">Incidents</h1>
            <p class="page-subtitle">Verify, assign and monitor field incidents</p>
          </div>
        </div>

        <div class="card">
          <div class="filter-bar">
            <select id="filter-status">
              <option value="">All Statuses</option>
              <option value="open">Open</option>
              <option value="in_progress">In Progress</option>
              <option value="resolved">Resolved</option>
              <option value="closed">Closed</option>
            </select>
            <select id="filter-severity">
              <option value="">All Severities</option>
              <option value="High" data-i18n="severity.high">High</option>
              <option value="Medium" data-i18n="severity.medium">Medium</option>
              <option value="Low" data-i18n="severity.low">Low</option>
            </select>
          </div>

          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th data-i18n="report.field.title">Title</th>
                <th data-i18n="report.field.category">Category</th>
                <th>District</th>
                <th>Severity</th>
                <th data-i18n="report.status">Status</th>
                <th>Assigned to</th>
                <th class="actions"></th>
              </tr>
            </thead>
            <tbody id="incidents-body"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="../../i18n/en.js"></script>
  <script src="../../i18n/ne.js"></script>
  <script src="../../i18n/mai.js"></script>
  <script src="../../i18n/index.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/reports.js"></script>
  <script src="../../js/incidents.js"></script>
  <script src="../../js/authorities.js"></script>
  <script>
    const role = requireRole("authority");
    mountShell(role);
    bootstrapIncidentsPage("incidents-body", {
      statusFilterId: "filter-status",
      severityFilterId: "filter-severity",
    });
  </script>
</body>
</html>
