<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authority Dashboard — Better Nepal</title>

  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/nepal.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>

    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>

      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title" data-i18n="nav.dashboard">Authority Dashboard</h1>
            <p class="page-subtitle">Incoming reports, active incidents, and monitored projects</p>
          </div>
          <a href="incidents.html" class="btn btn-primary">View All Incidents</a>
        </div>

        <div class="photo-banner">
          <picture>
            <source type="image/webp" srcset="../../assets/photography/infrastructure/kathmandu-rooftops-700.webp 700w, ../../assets/photography/infrastructure/kathmandu-rooftops-1400.webp 1400w" sizes="(max-width: 1024px) 100vw, 1200px">
            <img src="../../assets/photography/infrastructure/kathmandu-rooftops-1400.jpg" srcset="../../assets/photography/infrastructure/kathmandu-rooftops-700.jpg 700w, ../../assets/photography/infrastructure/kathmandu-rooftops-1400.jpg 1400w" sizes="(max-width: 1024px) 100vw, 1200px"
                 width="1400" height="1400"
                 alt="Dense city rooftops in the foreground with the snow-covered Himalayan range on the horizon behind." data-i18n-alt="photo.kathmandu-rooftops"
                 class="" style="--photo-focus:center 45%" loading="eager" fetchpriority="high">
          </picture>
          <span class="photo-credit">Photo: <a href="https://unsplash.com/photos/XAHCmk14JfU" target="_blank" rel="noopener noreferrer">Sanjay Hona</a> / Unsplash</span>
          <div>
            <div class="photo-banner-title" data-i18n="nav.dashboard">Dashboard</div>
            <p class="photo-banner-sub" data-i18n="dash.pendingVerification"></p>
          </div>
        </div>

        <div class="stat-strip" id="auth-stats"></div>

        <div class="details-layout mt-lg">
          <div>
            <div class="card">
              <div class="card-header">
                <h2 class="card-title">Active Incidents</h2>
                <a href="incidents.html" class="text-sm" data-i18n="common.viewAll">View all →</a>
              </div>
              <div class="incident-list" id="active-incidents"></div>
            </div>

            <div class="card mt-lg">
              <div class="card-header">
                <h2 class="card-title">Tracked Projects</h2>
                <a href="projects.html" class="text-sm" data-i18n="common.viewAll">View all →</a>
              </div>
              <div class="project-grid" id="tracked-projects"></div>
            </div>
          </div>

          <aside>
            <div class="card">
              <div class="card-header">
                <h2 class="card-title">National Alert Center</h2>
              </div>
              <div id="alert-list"></div>
            </div>

            <div class="card mt-lg">
              <div class="card-header">
                <h2 class="card-title">Quick Actions</h2>
              </div>
              <div class="flex flex-col gap-sm">
                <a href="reports.html" class="btn btn-outline">Review Reports</a>
                <a href="incidents.html" class="btn btn-outline">Verify Incidents</a>
                <a href="projects.html" class="btn btn-outline">Monitor Projects</a>
                <a href="map.html" class="btn btn-outline">Open Map</a>
              </div>
            </div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/dashboard.js"></script>
  <script src="../../i18n/en.js"></script>
  <script src="../../i18n/ne.js"></script>
  <script src="../../i18n/mai.js"></script>
  <script src="../../i18n/index.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/reports.js"></script>
  <script src="../../js/incidents.js"></script>
  <script src="../../js/projects.js"></script>
  <script src="../../js/alerts.js"></script>
  <script>
    const role = requireRole("authority");
    mountShell(role);
    (async () => {
      await bootstrapOverviewStats("auth-stats");
      try {
        renderIncidentList("active-incidents", await fetchIncidents({ per_page: 5 }), "incident-details.html");
      } catch (error) {
        reportApiError(error, "Could not load incidents.");
      }
      try {
        renderProjectGrid("tracked-projects", await fetchProjects({ per_page: 4 }), "project-details.html");
      } catch (error) {
        reportApiError(error, "Could not load projects.");
      }
      // The alert center was never wired - nothing ever populated it.
      renderAlertList("alert-list", { limit: 5 });
    })();
  </script>
</body>
</html>
