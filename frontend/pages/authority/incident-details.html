<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Incident Details — Better Nepal</title>

  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/nepal.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>

    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>

      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title" id="inc-title">Incident Details</h1>
            <p class="page-subtitle" id="inc-meta">Loading…</p>
          </div>
          <a href="incidents.html" class="btn btn-outline">← All Incidents</a>
        </div>

        <div class="details-layout">
          <div>
            <div class="card">
              <div class="card-header">
                <h2 class="card-title">Overview</h2>
                <span id="inc-status"></span>
              </div>

              <div class="meta-row">
                <div class="meta-item">
                  <span class="meta-label">Category</span>
                  <span class="meta-value" id="inc-type">—</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Severity</span>
                  <span class="meta-value" id="inc-sev">—</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Location</span>
                  <span class="meta-value" id="inc-location">—</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Reports linked</span>
                  <span class="meta-value" id="inc-count">—</span>
                </div>
              </div>

              <p class="text-muted mt-md" id="inc-desc"></p>
            </div>

            <div class="card mt-lg">
              <div class="card-header">
                <h2 class="card-title">Timeline</h2>
              </div>
              <div id="inc-timeline"></div>
            </div>
          </div>

          <aside>
            <div class="card">
              <div class="card-header">
                <h2 class="card-title">Assignment</h2>
              </div>
              <p class="text-sm"><strong id="inc-authority">Unassigned</strong></p>
              <p class="text-sm text-muted mt-sm" id="inc-authority-meta"></p>
            </div>

            <div class="card mt-lg" id="inc-actions-card">
              <div class="card-header">
                <h2 class="card-title">Actions</h2>
              </div>
              <div class="flex flex-col gap-sm" id="inc-actions"></div>
            </div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script src="../../i18n/en.js"></script>
  <script src="../../i18n/ne.js"></script>
  <script src="../../i18n/mai.js"></script>
  <script src="../../i18n/index.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/reports.js"></script>
  <script src="../../js/authorities.js"></script>
  <script src="../../js/incidents.js"></script>
  <script>
    const role = requireRole("authority");
    mountShell(role);

    const incidentId = new URLSearchParams(window.location.search).get("id");

    // Every next-status button offered is only a suggestion - the backend is
    // still the one that accepts or rejects the transition (409 if not, shown
    // via reportApiError), so this never needs its own copy of the state
    // machine.
    const NEXT_STATUS = {
      open: [["in_progress", "Mark In Progress"]],
      in_progress: [["resolved", "Mark Resolved"]],
      resolved: [["closed", "Close Incident"]],
      closed: [],
    };

    function renderActions(incident) {
      const actions = [];
      const next = NEXT_STATUS[incident.status] || [];
      for (const [status, label] of next) {
        actions.push(`<button class="btn btn-primary" data-status="${status}">${label}</button>`);
      }
      if (incident.status !== "closed") {
        actions.push(
          `<button class="btn btn-outline" data-assign="${incident.id}" data-district="${incident.district_id || ""}">${
            incident.authority_id ? "Reassign" : "Assign to Department"
          }</button>`
        );
      }
      document.getElementById("inc-actions").innerHTML =
        actions.join("") || '<p class="text-sm text-muted">No further action available.</p>';

      document.querySelectorAll("[data-status]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          try {
            await updateIncident(incident.id, { status: btn.dataset.status });
            showToast("Incident updated.", "success");
            load();
          } catch (error) {
            reportApiError(error, "Could not update this incident.");
            btn.disabled = false;
          }
        })
      );

      bindAssignButtons("inc-actions", load);
    }

    function renderIncidentTimeline(incident) {
      const steps = [
        { label: "Reported", time: incident.created_at, done: true },
        { label: "Assigned", time: incident.assigned_at, done: Boolean(incident.authority) },
        { label: "Resolved", time: incident.resolved_at, done: Boolean(incident.resolved_at) },
      ];
      document.getElementById("inc-timeline").innerHTML = `<ul class="timeline">${steps
        .map(
          (s) => `
        <li class="timeline-item ${s.done ? "done" : ""}">
          <span class="timeline-dot"></span>
          <div class="timeline-title">${escapeHtml(s.label)}</div>
          <div class="timeline-meta">${s.time ? escapeHtml(formatDate(s.time)) : "Pending"}</div>
        </li>`
        )
        .join("")}</ul>`;
    }

    async function load() {
      if (!incidentId) {
        showToast("No incident selected.", "error");
        return;
      }
      try {
        const incident = await fetchIncident(incidentId);

        document.getElementById("inc-title").textContent = incident.title;
        document.getElementById("inc-meta").textContent = `#${String(incident.id).slice(0, 8)} · ${humanise(incident.category)}`;
        document.getElementById("inc-status").innerHTML = statusBadge(incident.status);
        document.getElementById("inc-type").textContent = humanise(incident.category);
        document.getElementById("inc-sev").innerHTML = severityBadge(incident.severity);
        document.getElementById("inc-location").textContent =
          [incident.municipality, incident.district].filter(Boolean).join(", ") || "Location pending";
        document.getElementById("inc-count").textContent = incident.report_count ?? "—";
        document.getElementById("inc-desc").textContent = incident.description || "";

        document.getElementById("inc-authority").textContent = incident.authority ? incident.authority.name : "Unassigned";
        document.getElementById("inc-authority-meta").textContent = incident.authority
          ? (incident.assigned_at ? `Assigned ${formatDate(incident.assigned_at)}` : "Assigned")
          : "No department has been assigned yet.";

        renderIncidentTimeline(incident);
        renderActions(incident);
      } catch (error) {
        reportApiError(error, "Could not load this incident.");
      }
    }

    load();
  </script>
</body>
</html>
