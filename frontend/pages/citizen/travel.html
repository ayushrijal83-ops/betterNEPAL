<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem("bn_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Planner — Better Nepal</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/nepal.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/map.css" />
  <link rel="stylesheet" href="../../css/app.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #route-map { height: 460px; }
    .hub-list { max-height: 15rem; }
  </style>
</head>
<body >

  <header class="feed-header travel-header travel-header--photo photo photo-overlay-bottom">
    <picture>
      <source type="image/webp" srcset="../../assets/photography/trekking/flags-over-range-700.webp 700w, ../../assets/photography/trekking/flags-over-range-1400.webp 1400w" sizes="100vw">
      <img src="../../assets/photography/trekking/flags-over-range-1400.jpg" srcset="../../assets/photography/trekking/flags-over-range-700.jpg 700w, ../../assets/photography/trekking/flags-over-range-1400.jpg 1400w" sizes="100vw"
           width="1400" height="933"
           alt="Prayer flags strung above a trail on a high ridge, overlooking a snow-covered mountain range." data-i18n-alt="photo.flags-over-range"
           class="" style="--photo-focus:center 50%" loading="eager" fetchpriority="high">
    </picture>
    <span class="photo-credit">Photo: <a href="https://unsplash.com/photos/OKgA8QUMLnA" target="_blank" rel="noopener noreferrer">Kabi Acharya</a> / Unsplash</span>
    <div class="feed-header-inner travel-header-inner flex items-center justify-between">
      <div class="flex items-center gap-sm">
        <div class="feed-mark"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 23 Q 10 16 16 20 T 29 17" stroke-opacity=".55"/><path d="M8 13 L16 4 L24 13 L16 17 Z" stroke-linejoin="round"/><circle cx="16" cy="11" r="1.6" fill="currentColor" stroke="none"/></svg></div>
        <div>
          <h1 class="feed-title" data-i18n="nav.travel">Travel Planner</h1>
          <p class="feed-subtitle" data-i18n="travel.subtitle">Hazards reported along your route</p>
        </div>
      </div>
      <div class="page-lang-slot"><div id="page-lang"></div><a href="dashboard.html" class="feed-back">&larr; Dashboard</a></div>
    </div>
  </header>

  <main class="travel-main">

    <!-- Route inputs -->
    <section class="card travel-form">
      <div class="travel-fields">
        <div class="form-group district-picker">
          <label for="origin" class="form-label" data-i18n="travel.from">From</label>
          <input id="origin" type="text" autocomplete="off" placeholder="Kathmandu" class="form-input" />
          <div id="origin-list" class="hub-list hidden"></div>
        </div>

        <div class="form-group district-picker">
          <label for="destination" class="form-label" data-i18n="travel.to">To</label>
          <input id="destination" type="text" autocomplete="off" placeholder="Pokhara" class="form-input" />
          <div id="destination-list" class="hub-list hidden"></div>
        </div>

        <button id="plan-btn" class="btn btn-primary btn-lg">
          <span data-i18n="travel.plan">Check this route</span>
        </button>
      </div>

      <p class="mt-sm text-xs text-muted">
        Tip: you can also click the map twice — first click sets the start, second the destination.
      </p>
    </section>

    <div class="travel-layout">

      <!-- Map -->
      <section class="card travel-map-card">
        <div id="route-map" role="region" data-i18n-aria="map.title" aria-label="Map"></div>
        <p id="map-note" class="mt-sm text-xs text-muted"></p>
      </section>

      <!-- Rating + hazards -->
      <section class="feed-list">
        <div id="rating-card" class="card">
          <p class="text-sm text-muted">Plan a route to see its hazard rating.</p>
        </div>
        <div id="hazard-drawer" class="space-y-3"></div>
      </section>
    </div>
  </main>

  <script src="../../i18n/en.js"></script>
  <script src="../../i18n/ne.js"></script>
  <script src="../../i18n/mai.js"></script>
  <script src="../../i18n/index.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/chatbot.js"></script>
  <script>
    // Major hubs, for autocomplete. A local list rather than a geocoding API:
    // no key, no third party, and it keeps working on a bad connection - which
    // is exactly when someone checks whether a road is passable.
    const HUBS = [
      { name: "Kathmandu", lat: 27.7172, lng: 85.3240 },
      { name: "Pokhara", lat: 28.2096, lng: 83.9856 },
      { name: "Lalitpur", lat: 27.6588, lng: 85.3247 },
      { name: "Bhaktapur", lat: 27.6710, lng: 85.4298 },
      { name: "Biratnagar", lat: 26.4525, lng: 87.2718 },
      { name: "Birgunj", lat: 27.0104, lng: 84.8821 },
      { name: "Butwal", lat: 27.7006, lng: 83.4484 },
      { name: "Bharatpur", lat: 27.6766, lng: 84.4333 },
      { name: "Nepalgunj", lat: 28.0500, lng: 81.6167 },
      { name: "Dhangadhi", lat: 28.6833, lng: 80.6000 },
      { name: "Janakpur", lat: 26.7288, lng: 85.9266 },
      { name: "Hetauda", lat: 27.4287, lng: 85.0326 },
      { name: "Dharan", lat: 26.8065, lng: 87.2846 },
      { name: "Mugling", lat: 27.8600, lng: 84.5500 },
      { name: "Besisahar", lat: 28.2333, lng: 84.3833 },
      { name: "Jomsom", lat: 28.7806, lng: 83.7228 },
      { name: "Namche Bazaar", lat: 27.8069, lng: 86.7140 },
      { name: "Ilam", lat: 26.9094, lng: 87.9285 },
      { name: "Surkhet", lat: 28.6000, lng: 81.6167 },
      { name: "Jumla", lat: 29.2747, lng: 82.1838 },
    ];

    const DANGER_STYLE = {
      LOW: { chip: "bg-emerald-100 text-emerald-800 border-emerald-200", line: "#059669" },
      MODERATE: { chip: "bg-amber-100 text-amber-800 border-amber-200", line: "#d97706" },
      HIGH: { chip: "bg-rose-100 text-rose-800 border-rose-200", line: "#e11d48" },
      CRITICAL: { chip: "bg-rose-200 text-rose-900 border-rose-300", line: "#9f1239" },
    };

    const SEVERITY_CHIP = {
      critical: "bg-rose-100 text-rose-800",
      high: "bg-orange-100 text-orange-800",
      medium: "bg-amber-100 text-amber-800",
      low: "bg-slate-100 text-slate-700",
    };

    let map, routeLayer, pickState = 0;
    let origin = null, destination = null;

    function initMap() {
      map = L.map("route-map", { center: [28.3949, 84.124], zoom: 7 });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors", maxZoom: 18,
      }).addTo(map);
      routeLayer = L.layerGroup().addTo(map);

      map.on("click", (e) => {
        const point = { name: `${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`,
                        lat: e.latlng.lat, lng: e.latlng.lng };
        if (pickState === 0) {
          origin = point;
          document.getElementById("origin").value = point.name;
          pickState = 1;
        } else {
          destination = point;
          document.getElementById("destination").value = point.name;
          pickState = 0;
          planRoute();
        }
      });
    }

    // --- hub autocomplete ---
    function bindHubSearch(inputId, listId, assign) {
      const input = document.getElementById(inputId);
      const list = document.getElementById(listId);

      function render(query) {
        const needle = query.trim().toLowerCase();
        const matches = needle
          ? HUBS.filter((h) => h.name.toLowerCase().includes(needle))
          : HUBS;

        if (!matches.length) { list.classList.add("hidden"); return; }
        list.innerHTML = matches
          .map((h) => `<button type="button" data-name="${escapeHtml(h.name)}"
                 class="text-left text-sm">
                 ${escapeHtml(h.name)}</button>`)
          .join("");
        list.querySelectorAll("button").forEach((b) =>
          b.addEventListener("mousedown", (e) => {
            e.preventDefault();
            const hub = HUBS.find((h) => h.name === b.dataset.name);
            input.value = hub.name;
            assign(hub);
            list.classList.add("hidden");
          })
        );
        list.classList.remove("hidden");
      }

      input.addEventListener("focus", () => render(input.value));
      input.addEventListener("input", () => { assign(null); render(input.value); });
      input.addEventListener("blur", () => setTimeout(() => list.classList.add("hidden"), 120));
    }

    // --- rendering ---
    function renderRating(data) {
      const style = DANGER_STYLE[data.danger_level] || DANGER_STYLE.LOW;
      const approximate = data.method !== "postgis";

      document.getElementById("rating-card").innerHTML = `
        <div class="flex items-start justify-between gap-4">
          <div>
            <p class="text-xs uppercase tracking-wide text-dim font-semibold" data-i18n="travel.risk">Route risk</p>
            <p class="text-3xl font-bold">${escapeHtml(data.danger_level)}</p>
            <p class="text-sm text-muted">
              ${data.hazard_count} active hazard${data.hazard_count === 1 ? "" : "s"}
              along ${data.route.length_km} km
            </p>
          </div>
          <span class="shrink-0 border text-xs font-semibold ${style.chip}">
            score ${data.danger_score}
          </span>
        </div>

        <div class="grid-cols-4 gap-sm text-center">
          ${["critical","high","medium","low"].map((s) => `
            <div class="border">
              <p class="text-lg font-bold">${data.by_severity[s]}</p>
              <p class="text-[10px] uppercase tracking-wide text-muted">${s}</p>
            </div>`).join("")}
        </div>

        <p class="text-xs text-muted leading-relaxed">
          Searched a <strong>${(data.route.corridor_metres / 1000).toFixed(0)} km</strong> band around
          the straight line between your two points. Nepal's highways follow valleys rather than
          straight lines, so this is an indication of what is reported nearby — not a check of the
          road you will actually drive.
          ${approximate ? "Distances are approximate on this server." : ""}
        </p>`;
    }

    function renderHazards(hazards) {
      const drawer = document.getElementById("hazard-drawer");
      if (!hazards.length) {
        drawer.innerHTML = `
          <div class="glass border text-sm text-muted">
            Nothing has been reported near this route. That means no one has reported a
            problem — not that the road is confirmed clear.
          </div>`;
        return;
      }

      drawer.innerHTML = hazards.map((h) => `
        <article class="card">
          <div class="flex items-start justify-between gap-sm">
            <h3 class="font-semibold text-sm leading-snug">${escapeHtml(h.title)}</h3>
            <span class="shrink-0 text-xs font-semibold ${SEVERITY_CHIP[h.severity] ||"bg-slate-100 text-slate-700"}">
              ${escapeHtml(h.severity)}
            </span>
          </div>
          <p class="mt-sm text-xs text-muted">
            ${escapeHtml(humanise(h.category))} ·
            ${escapeHtml(h.district || "location unresolved")} ·
            ${(h.distance_from_route_metres / 1000).toFixed(1)} km off the line
          </p>
          <p class="feed-card-body line-clamp-3">${escapeHtml(h.description || "")}</p>
          <div class="mt-sm flex items-center gap-sm">
            <span class="text-xs">
              ${escapeHtml(humanise(h.status))}
            </span>
            ${h.authority ? `<span class="text-xs text-muted">
              ${escapeHtml(h.authority.name)}</span>` : ""}
          </div>
        </article>`).join("");
    }

    function drawRoute(data) {
      routeLayer.clearLayers();
      const style = DANGER_STYLE[data.danger_level] || DANGER_STYLE.LOW;
      const a = [data.route.start.latitude, data.route.start.longitude];
      const b = [data.route.end.latitude, data.route.end.longitude];

      // The corridor is drawn as a thick translucent stroke rather than a true
      // buffer polygon: it is the same shape, and it makes plain that the
      // search is a band around a line, not a road.
      L.polyline([a, b], {
        color: style.line, weight: 44, opacity: 0.12, lineCap: "round",
      }).addTo(routeLayer);
      L.polyline([a, b], { color: style.line, weight: 4, opacity: 0.9 }).addTo(routeLayer);

      L.marker(a).addTo(routeLayer).bindPopup("Start");
      L.marker(b).addTo(routeLayer).bindPopup("Destination");

      data.hazards.forEach((h) => {
        L.circleMarker([h.coordinates.latitude, h.coordinates.longitude], {
          radius: 8, color: "#fff", weight: 2,
          fillColor: DANGER_STYLE[h.severity === "critical" ? "CRITICAL" : "HIGH"].line,
          fillOpacity: 0.95,
        })
          .bindPopup(`<strong>${escapeHtml(h.title)}</strong><br>${escapeHtml(h.severity)}`)
          .addTo(routeLayer);
      });

      map.fitBounds(L.latLngBounds([a, b]).pad(0.25));
    }

    async function planRoute() {
      if (!origin || !destination) {
        showToast("Choose a start and a destination.", "error");
        return;
      }

      const button = document.getElementById("plan-btn");
      button.disabled = true;
      const original = button.textContent;
      button.textContent = "Checking…";
      document.getElementById("hazard-drawer").innerHTML = "";

      try {
        const data = await apiGet(
          `/travel/route${queryString({
            start_lat: origin.lat, start_lng: origin.lng,
            end_lat: destination.lat, end_lng: destination.lng,
          })}`,
          { auth: false }
        );
        renderRating(data);
        renderHazards(data.hazards);
        drawRoute(data);
        document.getElementById("map-note").textContent =
          `${origin.name} → ${destination.name} · ${data.route.length_km} km straight-line distance`;
      } catch (error) {
        document.getElementById("rating-card").innerHTML =
          `<p class="text-sm">${escapeHtml(
            reportApiError(error, "Could not check that route.")
          )}</p>`;
      } finally {
        button.disabled = false;
        button.textContent = original;
      }
    }

    // --- boot ---
    requireRole("citizen");
    initMap();
    bindHubSearch("origin", "origin-list", (hub) => { origin = hub; });
    bindHubSearch("destination", "destination-list", (hub) => { destination = hub; });
    document.getElementById("plan-btn").addEventListener("click", planRoute);

    // Scope the assistant to wherever the traveller is registered.
    const currentUser = TokenStore.getUser();
    if (currentUser && (currentUser.temporary_district_id || currentUser.permanent_district_id)) {
      document.body.dataset.districtId =
        currentUser.temporary_district_id || currentUser.permanent_district_id;
    }
  </script>
  <script>
    // These two pages carry their own header instead of the shared
    // navbar, so the switcher is mounted here rather than by mountShell.
    document.getElementById("page-lang").innerHTML =
      BN_I18N.switcherMarkup().replace("lang-switch", "lang-switch lang-switch--dark");
  </script>
</body>
</html>
