<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Issue — Citizen — Better Nepal</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/forms.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>
      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Report an Issue</h1>
            <p class="page-subtitle">Take photo → GPS location → Select issue → Submit</p>
          </div>
          <a href="dashboard.html" class="btn btn-outline">← Back</a>
        </div>

        <div class="form-layout">
          <form id="report-form">
            <div class="card">
              <div class="card-header">
                <h2 class="card-title">Issue Details</h2>
              </div>

              <div class="form-group">
                <label class="form-label">Photo</label>
                <div class="upload-zone" id="upload-zone">
                  <svg class="upload-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/>
                  </svg>
                  <p class="text-muted">Click to upload or drag an image</p>
                  <input type="file" accept="image/*" id="photo-input" hidden />
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Title</label>
                <input class="form-input" type="text" id="report-title"
                       placeholder="e.g. Broken streetlight on main road" />
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Location</label>
                  <input class="form-input" type="text" id="location"
                         value="Kathmandu, Bagmati Province" />
                  <div class="gps-chip">
                    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/>
                      <circle cx="12" cy="10" r="3"/>
                    </svg>
                    27.7172° N, 85.3240° E
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label">Category</label>
                  <select class="form-select" id="category"></select>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Severity</label>
                <div class="severity-options">
                  <label class="severity-option">
                    <input type="radio" name="severity" value="Low" />
                    <span class="sev-dot sev-low"></span>
                    <div class="sev-label">Low</div>
                  </label>
                  <label class="severity-option selected">
                    <input type="radio" name="severity" value="Medium" checked />
                    <span class="sev-dot sev-medium"></span>
                    <div class="sev-label">Medium</div>
                  </label>
                  <label class="severity-option">
                    <input type="radio" name="severity" value="High" />
                    <span class="sev-dot sev-high"></span>
                    <div class="sev-label">High</div>
                  </label>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-textarea" id="description"
                  placeholder="Describe the issue in detail..."></textarea>
              </div>

              <div class="form-actions">
                <a href="dashboard.html" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-danger btn-lg" id="submit-btn">Submit Report</button>
              </div>
            </div>
          </form>

          <aside>
            <div class="ai-panel">
              <div class="ai-panel-header">
                <span class="ai-badge">AI</span>
                Smart Classification Preview
              </div>
              <div class="ai-result-row">
                <span class="ai-result-label">Category</span>
                <span class="ai-result-value">Infrastructure</span>
              </div>
              <div class="ai-result-row">
                <span class="ai-result-label">Department</span>
                <span class="ai-result-value">Municipality</span>
              </div>
              <p class="text-muted text-sm mt-sm">Human verification required.</p>
            </div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/reports.js"></script>
  <script>
    const role = requireRole("citizen");
    mountShell(role);

    document.getElementById("category").innerHTML = renderCategoryOptions();

    // ---- evidence ----
    // The file is held until the report exists: media attaches to a record by
    // id, so there is nothing to attach it to until POST /reports returns.
    let selectedFile = null;

    const uploadZone = document.getElementById("upload-zone");
    const photoInput = document.getElementById("photo-input");

    uploadZone.addEventListener("click", () => photoInput.click());
    photoInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Reject here as well as server-side, so a 10MB holiday photo fails
      // instantly rather than after a long upload.
      if (file.size > 10 * 1024 * 1024) {
        showToast("Photos must be 10MB or smaller.", "error");
        photoInput.value = "";
        return;
      }

      selectedFile = file;
      const reader = new FileReader();
      reader.onload = (ev) => {
        uploadZone.classList.add("has-image");
        uploadZone.innerHTML = `<img src="${ev.target.result}" alt="Selected evidence" />`;
      };
      reader.readAsDataURL(file);
    });

    // ---- location ----
    // Coordinates are the only thing the backend accepts; district and
    // municipality are resolved server-side from them, so the text field is a
    // human landmark note and never used to place the report.
    let coordinates = null;
    const locationInput = document.getElementById("location");

    function showCoordinates() {
      if (!coordinates) return;
      locationInput.value =
        coordinates.lat.toFixed(5) + ", " + coordinates.lng.toFixed(5);
      locationInput.dataset.located = "true";
    }

    async function useDeviceLocation() {
      locationInput.placeholder = "Locating\u2026";
      const position = await getCurrentPosition();
      if (!position) {
        locationInput.placeholder = "Location unavailable \u2014 enter coordinates";
        showToast(
          "Could not read your location. Allow location access, or type coordinates as lat, lng.",
          "info",
          6000
        );
        return;
      }
      coordinates = { lat: position.lat, lng: position.lng };
      showCoordinates();
    }

    document.querySelectorAll("[data-locate]").forEach((el) =>
      el.addEventListener("click", (e) => {
        e.preventDefault();
        useDeviceLocation();
      })
    );

    // Accept a typed "27.7172, 85.3240" as a fallback for a denied permission.
    locationInput.addEventListener("change", () => {
      const match = locationInput.value.match(
        /^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/
      );
      if (match) coordinates = { lat: parseFloat(match[1]), lng: parseFloat(match[2]) };
    });

    // Ask on load; a refusal is a choice, not an error.
    useDeviceLocation();

    // ---- severity ----
    // The control stays (it is part of the design), but the value is not sent:
    // the backend Report model has no severity column. Severity is set by the
    // verifying authority when a report becomes an incident. Submitting it
    // would be silently discarded, which is worse than not sending it.
    document.querySelectorAll(".severity-option").forEach((opt) => {
      opt.addEventListener("click", () => {
        document
          .querySelectorAll(".severity-option")
          .forEach((o) => o.classList.remove("selected"));
        opt.classList.add("selected");
        opt.querySelector("input").checked = true;
      });
    });

    // ---- submit ----
    document.getElementById("report-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const btn = document.getElementById("submit-btn");
      const original = btn.textContent;

      if (!coordinates) {
        showToast(
          "A location is required. Use the locate button or type coordinates as lat, lng.",
          "error",
          6000
        );
        return;
      }

      btn.disabled = true;
      btn.textContent = "Submitting\u2026";

      try {
        const report = await createReport({
          title: document.getElementById("report-title").value.trim(),
          description: document.getElementById("description").value.trim(),
          category: document.getElementById("category").value,
          lat: coordinates.lat,
          lng: coordinates.lng,
        });

        // The report is saved. A failed photo upload must not lose it, so the
        // attachment is a separate step whose failure is reported without
        // discarding what already succeeded.
        if (selectedFile) {
          btn.textContent = "Uploading photo\u2026";
          try {
            await uploadEvidence(selectedFile, "report", report.id);
          } catch (uploadError) {
            reportApiError(
              uploadError,
              "The report was saved, but the photo could not be uploaded."
            );
          }
        }

        sessionStorage.setItem("bn_flash", "Report submitted");
        window.location.href = "report-details.html?id=" + encodeURIComponent(report.id);
      } catch (error) {
        reportApiError(error, "Could not submit the report.");
        btn.disabled = false;
        btn.textContent = original;
      }
    });
  </script>
</body>
</html>
