<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem("bn_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Citizen — Better Nepal</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/nepal.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/forms.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>
      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title" data-i18n="nav.profile">Profile</h1>
            <p class="page-subtitle">Manage your account information</p>
          </div>
        </div>

        <div class="form-layout">
          <div class="card">
            <div class="card-header"><h2 class="card-title">Account Details</h2></div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Full name</label>
                <input class="form-input" type="text" id="profile-name" value="" />
              </div>
              <div class="form-group">
                <label class="form-label">Email</label>
                <input class="form-input" type="email" id="profile-email" value="" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Phone</label>
                <input class="form-input" type="text" value="+977 98XXXXXXXX" />
              </div>
              <div class="form-group">
                <label class="form-label">District</label>
                <select class="form-select">
                  <option>Kathmandu</option>
                  <option>Lalitpur</option>
                  <option>Bhaktapur</option>
                </select>
              </div>
            </div>
            <div class="form-actions">
              <button class="btn btn-outline" onclick="logout()">Logout</button>
              <button class="btn btn-primary">Save Changes</button>
            </div>
          </div>

          <aside>
            <div class="card">
              <div class="card-header"><h2 class="card-title">My Activity</h2></div>
              <div class="budget-row"><span class="budget-label">Reports submitted</span><span class="budget-value">12</span></div>
              <div class="budget-row"><span class="budget-label" data-i18n="status.resolved">Resolved</span><span class="budget-value">5</span></div>
              <div class="budget-row"><span class="budget-label">Member since</span><span class="budget-value">Sept 2026</span></div>
            </div>
          </aside>
        </div>
        <div class="card mt-lg">
          <div class="card-header">
            <h2 class="card-title" data-i18n="profile.preferences">Preferences</h2>
          </div>
          <div class="form-group">
            <span class="form-label" data-i18n="profile.language">Interface language</span>
            <div id="profile-lang"></div>
            <p class="form-hint" data-i18n="profile.languageHint">Applies across the whole site and is remembered on this device.</p>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="../../i18n/en.js"></script>
  <script src="../../i18n/ne.js"></script>
  <script src="../../i18n/mai.js"></script>
  <script src="../../i18n/index.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/chatbot.js"></script>
  <script>
    const role = requireRole("citizen");
    mountShell(role);

    // The navbar switcher is always present; this is the same control in
    // the place a user goes looking for a saved preference.
    document.getElementById("profile-lang").innerHTML = BN_I18N.switcherMarkup();


    // Populated from /auth/me. The field previously shipped with a real-looking
    // name baked into the markup, which every account saw as their own.
    verifySession(role).then((user) => {
      if (!user) return;
      const name = document.getElementById("profile-name");
      const email = document.getElementById("profile-email");
      if (name) name.value = user.full_name || "";
      if (email) email.value = user.email || "";
    });

  </script>
</body>
</html>
