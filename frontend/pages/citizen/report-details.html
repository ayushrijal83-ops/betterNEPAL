<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem("bn_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Details — Citizen — Better Nepal</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/nepal.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>
      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title" id="report-title">Report Details</h1>
            <p class="page-subtitle" id="report-id-line">Loading report details…</p>
          </div>
          <a href="my-reports.html" class="btn btn-outline">← My Reports</a>
        </div>

        <div class="details-layout">
          <div>
            <div class="card">
              <div class="card-header">
                <h2 class="card-title">Report Media</h2>
                <span id="status-badge"></span>
              </div>
              <!-- The id is what js below targets. It previously sat on the
                   class only, so getElementById("report-media") returned null
                   and evidence never rendered; the bare <img> beneath it had
                   no src and drew a broken-image icon on every visit. -->
              <div class="report-media" id="report-media"></div>
              <div class="meta-row">
                <div class="meta-item"><span class="meta-label">Type</span><span class="meta-value" id="meta-type">—</span></div>
                <div class="meta-item"><span class="meta-label">Severity</span><span class="meta-value" id="meta-severity">—</span></div>
                <div class="meta-item"><span class="meta-label" data-i18n="report.field.location">Location</span><span class="meta-value" id="meta-location">—</span></div>
                <div class="meta-item"><span class="meta-label">Coordinates</span><span class="meta-value" id="meta-coords">—</span></div>
              </div>
              <p class="text-muted" id="report-description"></p>
            </div>

            <div class="card mt-lg">
              <div class="card-header"><h2 class="card-title">Progress Timeline</h2></div>
              <div id="timeline-container"></div>
            </div>
          </div>

          <aside>
            <div class="ai-panel">
              <div class="ai-panel-header">
                <span class="ai-badge">AI</span>
                AI-Assisted Analysis
              </div>
              <div class="confidence-circle"><span id="conf-value">—</span></div>
              <p class="text-center text-sm" style="color:#3730a3;font-weight:600;">Confidence Rating</p>
              <div class="ai-result-row mt-md">
                <span class="ai-result-label">Classification</span>
                <span class="ai-result-value" id="ai-class">—</span>
              </div>
              <div class="ai-result-row">
                <span class="ai-result-label">Department</span>
                <span class="ai-result-value" id="ai-dept">—</span>
              </div>
            </div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script src="../../i18n/en.js"></script>
  <script src="../../i18n/ne.js"></script>
  <script src="../../i18n/mai.js"></script>
  <script src="../../i18n/index.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/chatbot.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/reports.js"></script>
  <script>
    const role = requireRole(["citizen", "admin"]);
    mountShell(role);

    const reportId = new URLSearchParams(window.location.search).get("id");
    const subtitleEl = document.getElementById("report-id-line");

    // Small helper: set text on an id if that element actually exists on
    // this page, instead of assuming a data-field convention this page
    // never used.
    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    (async () => {
      if (!reportId) {
        if (subtitleEl) subtitleEl.textContent = "No report selected.";
        showToast("No report selected.", "error");
        return;
      }

      try {
        const report = await fetchReport(reportId);

        document.title = `${report.title} — Report Details — Better Nepal`;
        setText("report-title", report.title);
        if (subtitleEl) {
          subtitleEl.textContent =
            `#${String(report.id).slice(0, 8)} · ${humanise(report.category)} · Filed ${formatDate(report.created_at)}`;
        }
        setText("report-description", report.description);
        setText("meta-type", humanise(report.category));

        const coords = report.coordinates;
        setText(
          "meta-coords",
          coords ? `${coords.latitude.toFixed(4)}°, ${coords.longitude.toFixed(4)}°` : "—"
        );
        setText("meta-location", report.district || "Location pending");

        const statusEl = document.getElementById("status-badge");
        if (statusEl) statusEl.innerHTML = statusBadge(report.status);

        const timelineEl = document.getElementById("timeline-container");
        if (timelineEl) timelineEl.innerHTML = reportTimeline(report);

        // AI analysis lives in ai_metadata.analysis, written only once
        // someone has actually triggered analysis for this report (see
        // report_analysis_service.analyze_report) - most reports have none
        // yet, and that is a real, expected state, not a failure.
        const analysis = report.ai_metadata && report.ai_metadata.analysis;
        setText("meta-severity", analysis && analysis.severity ? humanise(analysis.severity) : "Not assessed");
        setText(
          "conf-value",
          analysis && typeof analysis.confidence === "number"
            ? `${Math.round(analysis.confidence * 100)}%`
            : "—"
        );
        setText(
          "ai-class",
          analysis && analysis.suggested_category ? humanise(analysis.suggested_category) : "Not analyzed yet"
        );
        // Report has no department field, and AI analysis does not assign
        // one - a report only gets a responsible department once it is
        // verified into an incident and routed to an authority. Saying so
        // plainly here beats inventing a value this record does not have.
        setText("ai-dept", "Not assigned yet");

        const mediaEl = document.getElementById("report-media");
        if (mediaEl) {
          const media = await fetchReportMedia(report.id);
          const origin = API_BASE_URL.replace("/api/v1", "");
          mediaEl.innerHTML = media.length
            ? media
                .map((m) => {
                  const href = `${origin}${m.url}`;
                  const name = escapeHtml(m.original_filename || "");
                  // Images are shown; anything else stays a download link.
                  return /\.(jpe?g|png|webp|gif)$/i.test(m.original_filename || "")
                    ? `<a href="${href}" target="_blank" rel="noopener">
                         <img src="${href}" alt="${name}" class="report-media-img" loading="lazy">
                       </a>`
                    : `<a href="${href}" target="_blank" rel="noopener">${name}</a>`;
                })
                .join("")
            : `<div class="empty-text">${tr("state.empty.hint", "No evidence attached.")}</div>`;
        }
      } catch (error) {
        // The subtitle is the one thing every visitor sees without scrolling,
        // so it - not just a toast that fades - carries the final state:
        // never left reading "Loading…" after a real failure.
        const message =
          error instanceof ApiError && error.status === 404
            ? "Report not found."
            : error instanceof ApiError && (error.status === 401 || error.status === 403)
              ? "You are not authorized to view this report."
              : "Unable to load report details. Please try again.";
        if (subtitleEl) subtitleEl.textContent = message;
        reportApiError(error, message);
      }
    })();
  </script>
</body>
</html>
