<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Citizen Dashboard — Better Nepal</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>
      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Citizen Dashboard</h1>
            <p class="page-subtitle">Good morning, Sanjal — Kathmandu, Nepal</p>
          </div>
          <a href="report.html" class="btn btn-danger">+ Report Issue</a>
        </div>

        <div class="grid grid-3 gap-md" id="cit-stats"></div>

        <div class="auth-layout mt-lg">
          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Recent Reports</h2>
              <a href="my-reports.html" class="text-sm">View all →</a>
            </div>
            <table class="table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Title</th>
                  <th>Status</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="cit-recent"></tbody>
            </table>
          </div>

          <aside>
            <div class="card">
              <div class="card-header">
                <h2 class="card-title">Local Alerts</h2>
                <a href="alerts.html" class="text-sm">All →</a>
              </div>
              <div id="cit-alerts"></div>
            </div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/reports.js"></script>
  <script src="../../js/alerts.js"></script>
  <script>
    const role = requireRole("citizen");
    mountShell(role);

    renderStats("cit-stats", [
      { value: "12", label: "My Reports" },
      { value: "7",  label: "Active" },
      { value: "5",  label: "Resolved" },
    ]);

    renderReportsTable("cit-recent", Object.values(MOCK_REPORTS).slice(0, 3));
    renderAlertList("cit-alerts", getAlerts());
  </script>
</body>
</html>
