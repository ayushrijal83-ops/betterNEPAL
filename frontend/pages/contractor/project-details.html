<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Details — Contractor — Better Nepal</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/nepal.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>
      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title" id="prj-name">Project Details</h1>
            <p class="page-subtitle" id="prj-meta">Loading…</p>
          </div>
          <a href="assigned-projects.html" class="btn btn-outline">← All Projects</a>
        </div>

        <div class="details-layout">
          <div>
            <div class="card">
              <div class="card-header">
                <h2 class="card-title" data-i18n="dash.overview">Overview</h2>
                <span id="prj-status"></span>
              </div>
              <p class="text-muted" id="prj-desc"></p>

              <div class="meta-row">
                <div class="meta-item"><span class="meta-label" data-i18n="report.field.location">Location</span><span class="meta-value" id="prj-location">—</span></div>
                <div class="meta-item"><span class="meta-label">Start</span><span class="meta-value" id="prj-start">—</span></div>
                <div class="meta-item"><span class="meta-label">Expected completion</span><span class="meta-value" id="prj-end">—</span></div>
                <div class="meta-item"><span class="meta-label">Progress</span><span class="meta-value" id="prj-progress-label">0%</span></div>
              </div>

              <div class="progress-bar mt-md">
                <div class="progress-fill" id="prj-progress" style="width:0%"></div>
              </div>
            </div>

            <div class="card mt-lg">
              <div class="card-header">
                <h2 class="card-title">Evidence</h2>
                <a href="evidence-upload.html" class="text-sm">+ Upload evidence</a>
              </div>
              <div class="evidence-grid" id="prj-evidence"></div>
            </div>

            <div class="card mt-lg">
              <div class="card-header"><h2 class="card-title">Milestones</h2></div>
              <div id="prj-timeline"></div>
            </div>
          </div>

          <aside>
            <div class="card">
              <div class="card-header"><h2 class="card-title">Budget</h2></div>
              <div class="budget-row"><span class="budget-label">Allocated</span><span class="budget-value" id="budget-allocated">—</span></div>
              <div class="budget-row"><span class="budget-label">Spent</span><span class="budget-value" id="budget-spent">—</span></div>
              <div class="budget-row"><span class="budget-label">Remaining</span><span class="budget-value" id="budget-remaining">—</span></div>
            </div>

            <div class="card mt-lg">
              <div class="card-header"><h2 class="card-title">Actions</h2></div>
              <div class="flex flex-col gap-sm">
                <a href="progress-update.html" class="btn btn-primary">Submit Progress Update</a>
                <a href="evidence-upload.html" class="btn btn-outline">Upload Site Evidence</a>
              </div>
            </div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../i18n/en.js"></script>
  <script src="../../i18n/ne.js"></script>
  <script src="../../i18n/mai.js"></script>
  <script src="../../i18n/index.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/reports.js"></script>
  <script src="../../js/projects.js"></script>
  <script>
    const role = requireRole("contractor");
    mountShell(role);

    const projectId = new URLSearchParams(window.location.search).get("id");

    (async () => {
      if (!projectId) {
        showToast("No project selected.", "error");
        return;
      }
      try {
        const project = await fetchProject(projectId);
        const root = document.querySelector(".page-content") || document.body;

        const fields = {
          title: project.title,
          description: project.description,
          authority: project.authority || "—",
          contractor: project.contractor ? project.contractor.full_name : "Unassigned",
          start: project.start_date || "Not started",
          due: project.estimated_end_date || "—",
        };
        Object.entries(fields).forEach(([key, value]) => {
          root.querySelectorAll(`[data-field="${key}"]`).forEach((el) => {
            el.textContent = value;
          });
        });
        root.querySelectorAll("[data-field=status]").forEach((el) => {
          el.innerHTML = statusBadge(project.status);
        });

        const ledgerEl = document.getElementById("project-timeline") ||
          document.getElementById("project-ledger");
        if (ledgerEl) {
          renderProgressLedger(ledgerEl.id, await fetchProgressUpdates(project.id));
        }
      } catch (error) {
        reportApiError(error, "Could not load this project.");
      }
    })();
  </script>
</body>
</html>
