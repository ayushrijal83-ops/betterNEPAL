<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem("bn_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Progress Update — Better Nepal</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/nepal.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/forms.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>
      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Submit Progress Update</h1>
            <p class="page-subtitle">Project: Bridge Repair — Trail #104</p>
          </div>
          <a href="dashboard.html" class="btn btn-outline">← Back</a>
        </div>

        <div class="form-layout">
          <form id="progress-form">
            <div class="card">
              <div class="card-header"><h2 class="card-title">Update Details</h2></div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="project-select">Project</label>
                  <select class="form-select" id="project-select" required>
                    <option value="">Loading your projects&hellip;</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="status-select">Change status</label>
                  <select class="form-select" id="status-select">
                    <option value="">Leave unchanged</option>
                    <option value="active">Active &mdash; work under way</option>
                    <option value="on_hold">On hold</option>
                    <option value="completed">Completed</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Current status</label>
                <div class="progress-bar"><div class="progress-fill" id="stage-bar" style="width:0%"></div></div>
                <div class="flex justify-between mt-sm text-sm text-muted">
                  <span id="stage-label">&mdash;</span>
                  <span id="stage-updates">&mdash;</span>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="notes">Work completed since last update</label>
                <textarea class="form-textarea" id="notes" required
                          placeholder="What was done on site since the last update?"></textarea>
              </div>

              <div class="form-group">
                <label class="form-label" for="materials">Materials used <span class="text-muted">(optional)</span></label>
                <textarea class="form-textarea" id="materials"
                          placeholder="Appended to the update note."></textarea>
              </div>

              <div class="form-actions">
                <a href="dashboard.html" class="btn btn-outline" data-i18n="common.cancel">Cancel</a>
                <button type="submit" class="btn btn-primary btn-lg">Submit Update</button>
              </div>
            </div>
          </form>

          <aside>
            <div class="ai-panel">
              <div class="ai-panel-header">
                <span class="ai-badge">AI</span>
                AI-Assisted Construction Review
              </div>
              <div class="confidence-circle"><span>88%</span></div>
              <p class="text-center text-sm" style="color:#3730a3;font-weight:600;">Confidence</p>
              <p class="text-sm mt-md">
                <strong>88% Confidence</strong> — AI analysis of evidence and logs.
              </p>
              <p class="text-sm text-muted mt-sm">
                High alignment with project plan and visual evidence.
              </p>
              <div class="ai-result-row mt-md">
                <span class="ai-result-label">Geo-tagged evidence</span>
                <span class="ai-result-value">Verified</span>
              </div>
            </div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script src="../../i18n/en.js"></script>
  <script src="../../i18n/ne.js"></script>
  <script src="../../i18n/mai.js"></script>
  <script src="../../i18n/index.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/projects.js"></script>
  <script src="../../js/reports.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    const role = requireRole("contractor");
    mountShell(role);

    const projectSelect = document.getElementById("project-select");
    const statusSelect = document.getElementById("status-select");
    const form = document.getElementById("progress-form");
    const submitBtn = form.querySelector("button[type=submit]");

    let projects = [];

    function showStage() {
      const project = projects.find((p) => p.id === projectSelect.value);
      const bar = document.getElementById("stage-bar");
      const label = document.getElementById("stage-label");
      const updates = document.getElementById("stage-updates");
      if (!project) return;

      const stage = projectStage(project.status);
      bar.style.width = stage.percent + "%";
      label.textContent = stage.label;
      updates.textContent =
        project.update_count + (project.update_count === 1 ? " update" : " updates");
    }

    projectSelect.addEventListener("change", showStage);

    (async () => {
      try {
        projects = await fetchMyProjects();

        // Finished work takes no further updates, so it is not offered.
        const open = projects.filter(
          (p) => p.status !== "completed" && p.status !== "cancelled"
        );

        if (!open.length) {
          projectSelect.innerHTML = '<option value="">No open projects assigned to you</option>';
          submitBtn.disabled = true;
          return;
        }

        projectSelect.innerHTML = open
          .map((p) => `<option value="${p.id}">${escapeHtml(p.title)}</option>`)
          .join("");

        // Preselect when arrived from a project page.
        const requested = new URLSearchParams(window.location.search).get("project");
        if (requested && open.some((p) => p.id === requested)) projectSelect.value = requested;

        showStage();
      } catch (error) {
        reportApiError(error, "Could not load your projects.");
        projectSelect.innerHTML = '<option value="">Could not load projects</option>';
        submitBtn.disabled = true;
      }
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const projectId = projectSelect.value;
      if (!projectId) {
        showToast("Choose a project first.", "error");
        return;
      }

      // The ledger stores one note, so the materials field is folded into it
      // rather than silently discarded.
      const materials = document.getElementById("materials").value.trim();
      const notes =
        document.getElementById("notes").value.trim() +
        (materials ? "\n\nMaterials used: " + materials : "");

      const original = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting\u2026";

      try {
        await postProgressUpdate(projectId, notes, statusSelect.value || undefined);
        sessionStorage.setItem("bn_flash", "Progress update submitted");
        window.location.href = "project-details.html?id=" + encodeURIComponent(projectId);
      } catch (error) {
        reportApiError(error, "Could not submit the update.");
        submitBtn.disabled = false;
        submitBtn.textContent = original;
      }
    });
  </script>
</body>
</html>
