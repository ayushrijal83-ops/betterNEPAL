<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assigned Projects — Better Nepal</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>
      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Assigned Projects</h1>
            <p class="page-subtitle">All projects currently assigned to your company</p>
          </div>
        </div>

        <div class="project-grid" id="project-grid"></div>

        <div class="card mt-lg">
          <div class="card-header"><h2 class="card-title">All Assignments</h2></div>
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Budget</th>
                <th>Progress</th>
                <th>Status</th>
                <th class="actions"></th>
              </tr>
            </thead>
            <tbody id="projects-body"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/reports.js"></script>
  <script src="../../js/projects.js"></script>
  <script>
    const role = requireRole("contractor");
    mountShell(role);
    renderProjectGrid("project-grid", getProjects());
    renderProjectsTable("projects-body", getProjects());
  </script>
</body>
</html>
