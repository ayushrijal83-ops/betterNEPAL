<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contractor Dashboard — Better Nepal</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>
      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Contractor Dashboard</h1>
            <p class="page-subtitle">Himalayan Infra Pvt. Ltd.</p>
          </div>
          <a href="progress-update.html" class="btn btn-primary">+ Submit Progress</a>
        </div>

        <div class="grid grid-4 gap-md" id="ctr-stats"></div>

        <div class="card mt-lg">
          <div class="card-header">
            <h2 class="card-title">Assigned Projects</h2>
            <a href="assigned-projects.html" class="text-sm">View all →</a>
          </div>
          <div class="project-grid" id="ctr-projects"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/reports.js"></script>
  <script src="../../js/projects.js"></script>
  <script>
    const role = requireRole("contractor");
    mountShell(role);

    renderStats("ctr-stats", [
      { value: "3", label: "Assigned Projects" },
      { value: "1", label: "In Progress" },
      { value: "1", label: "Completed" },
      { value: "88%", label: "Avg. Progress" },
    ]);

    renderProjectGrid("ctr-projects", getProjects());
  </script>
</body>
</html>
