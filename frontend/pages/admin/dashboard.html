<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem("bn_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Better Nepal</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/nepal.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>
      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">System Admin Dashboard</h1>
            <p class="page-subtitle">National platform oversight — reports, incidents, projects, users</p>
          </div>
        </div>

        <div class="stat-strip" id="admin-stats"></div>

        <div class="details-layout mt-lg">
          <div>
            <div class="card">
              <div class="card-header">
                <h2 class="card-title">Latest Incidents</h2>
                <a href="incidents.html" class="text-sm" data-i18n="common.viewAll">View all →</a>
              </div>
              <div class="incident-list" id="admin-incidents"></div>
            </div>

            <div class="card mt-lg">
              <div class="card-header">
                <h2 class="card-title">Active Projects</h2>
                <a href="projects.html" class="text-sm" data-i18n="common.viewAll">View all →</a>
              </div>
              <div class="project-grid" id="admin-projects"></div>
            </div>
          </div>

          <aside>
            <div class="card">
              <div class="card-header">
                <h2 class="card-title">System Health</h2>
              </div>
              <div id="system-health"></div>
            </div>

            <div class="card mt-lg">
              <div class="card-header">
                <h2 class="card-title">Quick Actions</h2>
              </div>
              <div class="flex flex-col gap-sm">
                <a href="users.html" class="btn btn-outline">Manage Users</a>
                <a href="authorities.html" class="btn btn-outline">Manage Authorities</a>
                <a href="departments.html" class="btn btn-outline" data-i18n="nav.departments">Departments</a>
                <a href="system.html" class="btn btn-outline">System Settings</a>
              </div>
            </div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script src="../../i18n/en.js"></script>
  <script src="../../i18n/ne.js"></script>
  <script src="../../i18n/mai.js"></script>
  <script src="../../i18n/index.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/reports.js"></script>
  <script src="../../js/incidents.js"></script>
  <script src="../../js/projects.js"></script>
  <script src="../../js/alerts.js"></script>
  <script src="../../js/dashboard.js"></script>
  <script>
    const role = requireRole("admin");
    mountShell(role);

    // Every row here is a real signal, not a fixed "Healthy" label: the API/DB
    // row reflects whether this page's own calls actually succeeded, and the
    // AI row reads the real per-node status GET /health already exposes.
    // A row with no real signal (there is no map-tile health check in this
    // backend) is left out rather than invented.
    function healthRow(label, ok, detail) {
      return `<div class="budget-row">
        <span class="budget-label">${escapeHtml(label)}</span>
        <span class="budget-value"><span class="badge ${ok ? "badge-success" : "badge-critical"}">${escapeHtml(detail)}</span></span>
      </div>`;
    }

    (async () => {
      let apiReachable = false;

      try {
        const overview = await bootstrapOverviewStats("admin-stats");
        apiReachable = Boolean(overview);
      } catch (_) {
        apiReachable = false;
      }

      renderLoading("admin-incidents", "Loading incidents\u2026");
      try {
        const incidents = await fetchIncidents({ per_page: 5 });
        renderIncidentList("admin-incidents", incidents, "incidents.html");
      } catch (error) {
        renderError("admin-incidents", reportApiError(error, "Could not load incidents."));
      }

      renderLoading("admin-projects", "Loading projects\u2026");
      try {
        const projects = await fetchProjects({ per_page: 4 });
        renderProjectGrid("admin-projects", projects, "projects.html");
      } catch (error) {
        renderError("admin-projects", reportApiError(error, "Could not load projects."));
      }

      let health = healthRow("API & database", apiReachable, apiReachable ? "Reachable" : "Unreachable");
      try {
        const status = await apiGet("/health", { auth: false });
        const ai = status.ai || {};
        const nodeUp = ai.nodes && Object.values(ai.nodes).some((n) => n.reachable);
        health += healthRow(
          "AI services",
          ai.available && nodeUp,
          ai.available ? (nodeUp ? "Reachable" : "Configured, unreachable") : "Not configured"
        );
      } catch (_) {
        health += healthRow("AI services", false, "Could not check");
      }
      document.getElementById("system-health").innerHTML = health;
    })();
  </script>
</body>
</html>
