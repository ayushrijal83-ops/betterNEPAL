<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem("bn_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users — Admin — Better Nepal</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/nepal.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>
      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title" data-i18n="nav.users">Users</h1>
            <p class="page-subtitle">All registered users across roles</p>
          </div>
        </div>

        <div class="card">
          <div id="users-panel"></div>
        </div>

      </main>
    </div>
  </div>

  <script src="../../i18n/en.js"></script>
  <script src="../../i18n/ne.js"></script>
  <script src="../../i18n/mai.js"></script>
  <script src="../../i18n/index.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script>
    const role = requireRole("admin");
    mountShell(role);

    // This page previously rendered seven invented people - names, districts
    // and join dates - as if they were real registered users of the platform.
    //
    // There is no users endpoint to replace them with: the API exposes
    // /authorities but nothing that lists accounts, and building one is a
    // backend feature, which this redesign is explicitly not doing. An honest
    // empty state is better than a convincing fake user directory in an
    // admin console.
    renderEmpty(
      "users-panel",
      "User directory not available yet",
      "The platform does not expose an account listing endpoint. This view will populate once one exists."
    );
  </script>
</body>
</html>
