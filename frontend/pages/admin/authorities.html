<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authorities — Admin — Better Nepal</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>
      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Authorities</h1>
            <p class="page-subtitle">Government offices responsible for issue resolution</p>
          </div>
          <button class="btn btn-primary">+ Add Authority</button>
        </div>

        <div class="card">
          <table class="table">
            <thead>
              <tr>
                <th>Name</th>
                <th>District</th>
                <th>Province</th>
                <th>Category</th>
                <th>Contact</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody id="authorities-body"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/authorities.js"></script>
  <script>
    const role = requireRole("admin");
    mountShell(role);

    renderAuthoritiesTable("authorities-body", getAuthorities());
  </script>
</body>
</html>
