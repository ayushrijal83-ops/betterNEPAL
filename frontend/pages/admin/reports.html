<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Reports — Admin — Better Nepal</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>
      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">All Reports</h1>
            <p class="page-subtitle">Every report across the platform</p>
          </div>
        </div>

        <div class="card">
          <div class="filter-bar">
            <select id="filter-status">
              <option value="">All Statuses</option>
              <option value="Reported">Reported</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
            </select>
            <select id="filter-severity">
              <option value="">All Severities</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
            <input type="text" placeholder="Search title, reporter..." />
          </div>

          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Category</th>
                <th>Severity</th>
                <th>Status</th>
                <th>Date</th>
                <th class="actions"></th>
              </tr>
            </thead>
            <tbody id="reports-body"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/reports.js"></script>
  <script>
    const role = requireRole("admin");
    mountShell(role);

    function applyFilters() {
      const status = document.getElementById("filter-status").value;
      const severity = document.getElementById("filter-severity").value;
      let list = Object.values(MOCK_REPORTS);
      if (status) list = list.filter((r) => r.status === status);
      if (severity) list = list.filter((r) => r.severity === severity);
      renderReportsTable("reports-body", list);
    }

    document.getElementById("filter-status").addEventListener("change", applyFilters);
    document.getElementById("filter-severity").addEventListener("change", applyFilters);

    applyFilters();
  </script>
</body>
</html>
