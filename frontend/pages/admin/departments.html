<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Departments — Admin — Better Nepal</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/nepal.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>
      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title" data-i18n="nav.departments">Departments</h1>
            <p class="page-subtitle">Categorised government departments</p>
          </div>
          <button class="btn btn-primary" id="btn-add-department">+ Add Department</button>
        </div>

        <div class="project-grid" id="dept-grid"></div>

        <div class="card mt-lg">
          <div class="card-header"><h2 class="card-title" data-i18n="nav.departments">All Departments</h2></div>
          <table class="table">
            <thead>
              <tr>
                <th>Name</th>
                <th data-i18n="report.field.category">Type</th>
                <th>Level</th>
                <th>District</th>
              </tr>
            </thead>
            <tbody id="dept-table-body"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="../../i18n/en.js"></script>
  <script src="../../i18n/ne.js"></script>
  <script src="../../i18n/mai.js"></script>
  <script src="../../i18n/index.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/reports.js"></script>
  <script src="../../js/authorities.js"></script>
  <script>
    const role = requireRole("admin");
    mountShell(role);

    const LEVELS = [
      ["federal", "Federal"],
      ["provincial", "Provincial"],
      ["local", "Local"],
      ["utility", "Utility"],
    ];
    const TYPES = [
      ["department_of_roads", "Department of Roads"],
      ["municipal_office", "Municipal Office"],
      ["water_authority", "Water Authority"],
      ["electricity_authority", "Electricity Authority"],
      ["other", "Other"],
    ];

    document.getElementById("btn-add-department").addEventListener("click", () => {
      openModal({
        title: "Register a department",
        bodyHtml: `
          <div class="form-group">
            <label class="form-label">Name</label>
            <input class="form-input" id="dept-name" placeholder="e.g. Department of Roads - Bagmati" />
          </div>
          <div class="form-group">
            <label class="form-label">Level</label>
            <select class="form-select" id="dept-level">
              ${LEVELS.map(([v, l]) => `<option value="${v}">${escapeHtml(l)}</option>`).join("")}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Type</label>
            <select class="form-select" id="dept-type">
              ${TYPES.map(([v, l]) => `<option value="${v}">${escapeHtml(l)}</option>`).join("")}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Contact email (optional)</label>
            <input class="form-input" id="dept-email" type="email" placeholder="office@example.gov.np" />
          </div>
          <div class="form-hint">National body - leave district unset for now; per-district assignment is edited from the authority's own record.</div>`,
        confirmText: "Register",
        onConfirm: async () => {
          const name = document.getElementById("dept-name").value.trim();
          if (!name) {
            showToast("A name is required.", "error");
            return;
          }
          try {
            await apiPost("/authorities", {
              name,
              level: document.getElementById("dept-level").value,
              type: document.getElementById("dept-type").value,
              contact_email: document.getElementById("dept-email").value.trim() || undefined,
            });
            showToast("Department registered.", "success");
            loadAuthorities();
          } catch (error) {
            reportApiError(error, "Could not register the department.");
          }
        },
      });
    });

    // These were seven hardcoded rows naming real Nepali institutions with
    // invented open-case counts and progress percentages. Attributing made-up
    // performance figures to an actual government body is not a placeholder,
    // it is a fabricated record - so this reads the authorities API instead.
    // The table below reuses the same fetch - there is no per-authority
    // assignment-count endpoint on the list route, so that column is left out
    // entirely rather than filled with another invented number.
    async function loadAuthorities() {
      const grid = document.getElementById("dept-grid");
      renderLoading("dept-grid");
      try {
        const authorities = await fetchAuthorities({ per_page: 60 });
        if (!authorities.length) {
          renderEmpty(
            "dept-grid",
            t("state.empty.title"),
            "No authorities have been registered yet."
          );
          document.getElementById("dept-table-body").innerHTML =
            `<tr><td colspan="4"><div class="empty-text">No authorities have been registered yet.</div></td></tr>`;
          return;
        }
        grid.innerHTML = authorities
          .map(
            (a) => `
          <div class="project-card">
            <div class="project-name">${escapeHtml(a.name)}</div>
            <div class="project-meta">
              ${escapeHtml(a.type || "")}${a.level ? " · " + escapeHtml(a.level) : ""}
              ${a.district ? " · " + escapeHtml(a.district) : ""}
            </div>
          </div>`
          )
          .join("");

        document.getElementById("dept-table-body").innerHTML = authorities
          .map(
            (a) => `
          <tr>
            <td>${escapeHtml(a.name)}</td>
            <td>${escapeHtml(humanise(a.type || ""))}</td>
            <td>${escapeHtml(humanise(a.level || ""))}</td>
            <td>${escapeHtml(a.district || "National")}</td>
          </tr>`
          )
          .join("");
      } catch (error) {
        renderError("dept-grid", reportApiError(error, t("state.error.generic")));
      }
    }

    loadAuthorities();
  </script>
</body>
</html>
