<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guide Dashboard — Better Nepal</title>

  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>

    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>

      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Guide Dashboard</h1>
            <p class="page-subtitle">Good morning, Sanjal</p>
          </div>
          <a href="report.html" class="btn btn-danger">+ Report Issue</a>
        </div>

        <div class="grid grid-3 gap-md" id="guide-stats"></div>

        <div class="card mt-lg">
          <div class="card-header">
            <h2 class="card-title">Recent Reports</h2>
          </div>
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Status</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="guide-recent-reports"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/dashboard.js"></script>
  <script>
  const role = requireRole("guide");
  mountShell(role);

  renderSkeletonTable("guide-recent-reports", 3, 4);

  setTimeout(() => {
    renderStats("guide-stats", [
      { value: "12", label: "My Reports" },
      { value: "7",  label: "Active" },
      { value: "5",  label: "Resolved" },
    ]);
    renderReportsTable("guide-recent-reports", [
      { id: "BNP1098", title: "Bridge damaged — Annapurna Region", status: "Critical",    badgeClass: "badge-critical", date: "24 Oct 2026" },
      { id: "BNP1097", title: "Trail blocked by landslide",       status: "In Progress", badgeClass: "badge-warning",  date: "23 Oct 2026" },
      { id: "BNP1095", title: "Waste accumulation near rest point",status: "Resolved",    badgeClass: "badge-success",  date: "22 Oct 2026" },
    ]);
  }, 250);
</script>
</body>
</html>
