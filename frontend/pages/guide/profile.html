<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Guide — Better Nepal</title>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/forms.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>
      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Guide Profile</h1>
            <p class="page-subtitle">Your guide account and license information</p>
          </div>
        </div>

        <div class="form-layout">
          <div class="card">
            <div class="card-header"><h2 class="card-title">Guide Details</h2></div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Full name</label>
                <input class="form-input" type="text" value="Sanjal Neupane" />
              </div>
              <div class="form-group">
                <label class="form-label">Guide License ID</label>
                <input class="form-input" type="text" value="TG-2024-00871" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Primary region</label>
                <input class="form-input" type="text" value="Annapurna Region" />
              </div>
              <div class="form-group">
                <label class="form-label">Years of experience</label>
                <input class="form-input" type="number" value="8" />
              </div>
            </div>
            <div class="form-actions">
              <button class="btn btn-outline" onclick="logout()">Logout</button>
              <button class="btn btn-primary">Save Changes</button>
            </div>
          </div>

          <aside>
            <div class="card">
              <div class="card-header"><h2 class="card-title">My Impact</h2></div>
              <div class="budget-row"><span class="budget-label">Reports submitted</span><span class="budget-value">42</span></div>
              <div class="budget-row"><span class="budget-label">Verified reports</span><span class="budget-value">38</span></div>
              <div class="budget-row"><span class="budget-label">Projects triggered</span><span class="budget-value">6</span></div>
            </div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    const role = requireRole("guide");
    mountShell(role);
  </script>
</body>
</html>
