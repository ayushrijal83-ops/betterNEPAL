<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Reports — Better Nepal</title>

  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/nepal.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <link rel="stylesheet" href="../../css/navbar.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <div class="app-layout">
    <aside id="app-sidebar" class="sidebar"></aside>

    <div class="app-main">
      <header id="app-navbar" class="navbar"></header>

      <main class="app-content">
        <div class="page-header">
          <div>
            <h1 class="page-title" data-i18n="nav.myReports">My Reports</h1>
            <p class="page-subtitle">All reports you have submitted</p>
          </div>
          <a href="report.html" class="btn btn-primary">+ New Report</a>
        </div>

        <div class="card">
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th data-i18n="report.field.title">Title</th>
                <th data-i18n="report.field.category">Category</th>
                <th>Severity</th>
                <th data-i18n="report.status">Status</th>
                <th data-i18n="report.filed">Date</th>
                <th class="actions"></th>
              </tr>
            </thead>
            <tbody id="reports-body"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="../../i18n/en.js"></script>
  <script src="../../i18n/ne.js"></script>
  <script src="../../i18n/mai.js"></script>
  <script src="../../i18n/index.js"></script>
  <script src="../../js/config.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/reports.js"></script>
  <script>
    const role = requireRole("guide");
    mountShell(role);
    bootstrapMyReports("reports-body", "report-details.html");
  </script>
</body>
</html>
